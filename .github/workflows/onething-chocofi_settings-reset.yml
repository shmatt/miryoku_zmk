# No display shields here. settings_reset disables Bluetooth, but nice!view's
# status widget pulls in zmk/ble.h and uses CONFIG_BT_MAX_PAIRED, so the two
# cannot be built together -- and a firmware whose only job is to clear
# stored settings has no use for a screen anyway. The keyboard name and TX
# power went with it for the same reason.
#
# miryoku.dtsi now includes behaviors/mouse_keys.dtsi and pointing.h
# unconditionally, so even a settings-wipe build needs a ZMK tree with
# pointing support -- hence the same branch and CONFIG_ZMK_POINTING as the
# daily driver. The Joy-Con module is deliberately left out: this build exists
# only to clear stored settings.
name: 'OneThing Chocofi Keyboard (settings reset)'
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano/nrf52840/zmk"]'
      shield: '["corne_left settings_reset","corne_right settings_reset"]'
      alphas: '["qwerty"]'
      nav: '["vi"]'
      custom_config: '["#define MIRYOKU_TAP_QWERTY\n#define MIRYOKU_EXTRA_COLEMAKDH"]'
      kconfig: '["CONFIG_ZMK_POINTING=y"]'
      branches: '["shmatt/zmk/feat/gamepad-hid"]'
