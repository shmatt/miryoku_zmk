# The daily driver. This is the build that gets flashed, so it carries the
# Joy-Con 2 support rather than keeping it in a side workflow.
#
# Load-bearing config, do not trim:
#
# - The ZMK branch is shmatt/zmk/feat/gamepad-hid, which adds the gamepad HID
#   report. ZMK's report descriptor is a static const array in its own
#   headers, so a module cannot add a report and the patched tree is required.
# - The MTU and data-length settings are what make the controllers stream at
#   all: their input report is 63 bytes, so ATT needs an MTU of at least 66.
#   At the default 65 the controllers connect, subscribe and then send
#   nothing, which looks exactly like a decode bug.
# - Quoting: values here are passed through main.yml via env, so the keyboard
#   name may contain spaces. Historically a quoted value silently discarded
#   this entire block, which cost the keyboard name, the TX power and the MTU.
#
# The Media layer is overridden to put a dictation key where RGB hue-up would
# be (right hand, top row, index finger). There is no RGB on this board, so
# those five keys were dead. Consumer usage 0x0D8 is the standard dictation
# key; AOSP's Generic.kl maps it to DICTATE both by usage and via Linux
# keycode 586, whereas C_VOICE_COMMAND (0xCF) maps to VOICE_ASSIST and only
# launches Assistant. ZMK's headers stop at 0x0D7, hence the local define.
# The override is one line on purpose: the workflow passes this config through
# echo, so a macro with backslash continuations would not survive.
#
# After flashing a build whose HID config differs from the last one, forget
# the keyboard on the host and re-pair. Android caches the report descriptor
# per bond and parses new reports with the old layout otherwise.
name: 'OneThing Chocofi Keyboard'
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano/nrf52840/zmk"]'
      shield: '["corne_left nice_view_adapter nice_view","corne_right nice_view_adapter nice_view"]'
      alphas: '["qwerty"]'
      nav: '["vi"]'
      custom_config: '["#define MIRYOKU_TAP_QWERTY\n#define MIRYOKU_EXTRA_COLEMAKDH\n#define ZMK_POINTING_DEFAULT_MOVE_VAL 2200\n#define ZMK_POINTING_DEFAULT_SCRL_VAL 20\n#define MIRYOKU_KLUDGE_JOYCON2\n#define C_DICTATE (ZMK_HID_USAGE(HID_USAGE_CONSUMER, 0xD8))\n#define MIRYOKU_LAYER_MEDIA U_BOOT, &u_to_U_TAP, &u_to_U_EXTRA, &u_to_U_BASE, U_NA, U_RGB_EFF, &kp C_DICTATE, U_RGB_SAI, U_RGB_BRI, U_RGB_TOG, &kp LGUI, &kp LALT, &kp LCTRL, &kp LSHFT, U_NA, &kp C_PREV, &kp C_VOL_DN, &kp C_VOL_UP, &kp C_NEXT, U_EP_TOG, U_NA, &kp RALT, &u_to_U_FUN, &u_to_U_MEDIA, U_NA, &u_bt_sel_0, &u_bt_sel_1, &u_bt_sel_2, &u_bt_sel_3, &u_out_tog, U_NP, U_NP, U_NA, U_NA, U_NA, &kp C_STOP, &kp C_PP, &kp C_MUTE, U_NP, U_NP"]'
      kconfig: '["CONFIG_ZMK_DISPLAY=y\nCONFIG_ZMK_KEYBOARD_NAME=\"OneThing Choc\"\nCONFIG_BT_CTLR_TX_PWR_PLUS_8=y\nCONFIG_BT_L2CAP_TX_MTU=250\nCONFIG_BT_BUF_ACL_RX_SIZE=254\nCONFIG_BT_CTLR_DATA_LENGTH_MAX=251\nCONFIG_BT_USER_DATA_LEN_UPDATE=y\nCONFIG_BT_AUTO_DATA_LEN_UPDATE=y\nCONFIG_ZMK_POINTING=y\nCONFIG_ZMK_GAMEPAD=y"]'
      branches: '["shmatt/zmk/feat/gamepad-hid"]'
      modules: '["shmatt/zmk-joycon2/main"]'
