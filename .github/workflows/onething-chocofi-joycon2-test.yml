# Joy-Con 2 project — Stage 1 POC test build.
# Manually triggered only (workflow_dispatch), does not run on push/PR, and
# does not affect the production "OneThing Chocofi Keyboard" build: it only
# differs by adding MIRYOKU_KLUDGE_JOYCON2_DEBUG (inert everywhere else) and
# the zmk-joycon2 module.
name: 'OneThing Chocofi Joy-Con2 POC Test'
on:
  workflow_dispatch:
jobs:
  build:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["corne_left nice_view_adapter nice_view","corne_right nice_view_adapter nice_view"]'
      alphas: '["qwerty"]'
      nav: '["vi"]'
      custom_config: '["#define MIRYOKU_TAP_QWERTY\n#define MIRYOKU_EXTRA_COLEMAKDH\n#define MIRYOKU_KLUDGE_MOUSEKEYSPR\n#define MIRYOKU_KLUDGE_JOYCON2_DEBUG"]'
      # CONFIG_BT_CTLR_DATA_LENGTH_MAX: Zephyr's default is BT_BUF_ACL_RX_SIZE
      # only when that is <251, else 27 -- so setting BUF_ACL_RX_SIZE=254 alone
      # silently left the link layer at 27-byte PDUs (no Data Length Extension).
      # Every host known to receive Joy-Con 2 input (macOS/Windows) runs DLE.
      # NO DOUBLE QUOTES ALLOWED in this kconfig value: main.yml interpolates
      # it raw into a shell [ ] test, and embedded quotes (as in
      # CONFIG_ZMK_KEYBOARD_NAME="...") break the test with "unexpected
      # operator", silently skipping the ENTIRE kconfig block -- confirmed in
      # run 32015882153's logs. That means no kconfig line here (or in the
      # production workflow, which has the same quoted name) has ever been
      # applied to any build. Keyboard-name line dropped to unbreak the rest.
      #
      # BT_USER_DATA_LEN_UPDATE exposes the le_data_len_updated callback so
      # firmware can print the actually-negotiated LL payload size; enabling
      # it flips BT_AUTO_DATA_LEN_UPDATE's default to n, so force that back
      # on to keep auto-negotiation.
      kconfig: '["CONFIG_ZMK_DISPLAY=y\nCONFIG_BT_CTLR_TX_PWR_PLUS_8=y\nCONFIG_BT_L2CAP_TX_MTU=250\nCONFIG_BT_BUF_ACL_RX_SIZE=254\nCONFIG_BT_CTLR_DATA_LENGTH_MAX=251\nCONFIG_BT_USER_DATA_LEN_UPDATE=y\nCONFIG_BT_AUTO_DATA_LEN_UPDATE=y\nCONFIG_ZMK_HID_IO=y\nCONFIG_ZMK_HID_IO_JOYSTICK=y\nCONFIG_ZMK_HID_IO_LEGACY_ENDPOINT_ACCESSOR=y"]'
      branches: '["shmatt/zmk/feat/mouse-keys-3.2"]'
      # zmk-hid-io provides the second HID-over-GATT service that exposes a
      # Generic Desktop Joystick to the host -- ZMK's own report descriptor is
      # a static const array in its app headers and can't be extended from an
      # out-of-tree module.
      # NOTE: each element of this JSON array is a separate build VARIANT, not
      # an extra module. main.yml does `for module in $modules`, so several
      # modules for ONE build go in a single space-separated string.
      modules: '["shmatt/zmk-joycon2/main shmatt/zmk-hid-io/compat/legacy-endpoint-accessor"]'
