# Joy-Con 2 project — Stage 1 POC test build.
# Manually triggered only (workflow_dispatch), does not run on push/PR, and
# does not affect the production "OneThing Chocofi Keyboard" build: it only
# differs by adding MIRYOKU_KLUDGE_JOYCON2_DEBUG (inert everywhere else) and
# the zmk-joycon2 module.
name: 'OneThing Chocofi Joy-Con2 POC Test'
on:
  workflow_dispatch:
jobs:
  build:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["corne_left nice_view_adapter nice_view","corne_right nice_view_adapter nice_view"]'
      alphas: '["qwerty"]'
      nav: '["vi"]'
      custom_config: '["#define MIRYOKU_TAP_QWERTY\n#define MIRYOKU_EXTRA_COLEMAKDH\n#define ZMK_MOUSE_DEFAULT_MOVE_VAL 2200\n#define MIRYOKU_KLUDGE_MOUSEKEYSPR\n#define MIRYOKU_KLUDGE_JOYCON2_DEBUG"]'
      # CONFIG_BT_CTLR_DATA_LENGTH_MAX: Zephyr's default is BT_BUF_ACL_RX_SIZE
      # only when that is <251, else 27 -- so setting BUF_ACL_RX_SIZE=254 alone
      # silently left the link layer at 27-byte PDUs (no Data Length Extension).
      # Every host known to receive Joy-Con 2 input (macOS/Windows) runs DLE.
      # Double quotes are safe here again: main.yml now passes this value
      # through the environment instead of pasting it into the shell. Before
      # that fix the quoted keyboard name broke the enclosing [ ] test and
      # silently discarded this whole block -- which is what left the ATT MTU
      # at its 65-byte default, one byte too small for a 63-byte Joy-Con input
      # report, so no input ever arrived.
      #
      # BT_USER_DATA_LEN_UPDATE exposes the le_data_len_updated callback so
      # firmware can print the actually-negotiated LL payload size; enabling
      # it flips BT_AUTO_DATA_LEN_UPDATE's default to n, so force that back
      # on to keep auto-negotiation.
      kconfig: '["CONFIG_ZMK_DISPLAY=y\nCONFIG_ZMK_KEYBOARD_NAME=\"OneThing Choc\"\nCONFIG_BT_CTLR_TX_PWR_PLUS_8=y\nCONFIG_BT_L2CAP_TX_MTU=250\nCONFIG_BT_BUF_ACL_RX_SIZE=254\nCONFIG_BT_CTLR_DATA_LENGTH_MAX=251\nCONFIG_BT_USER_DATA_LEN_UPDATE=y\nCONFIG_BT_AUTO_DATA_LEN_UPDATE=y\nCONFIG_ZMK_MOUSE=y\nCONFIG_ZMK_GAMEPAD=y\nCONFIG_ZMK_JOYCON2_LEGACY_ENDPOINT_API=y"]'
      # feat/gamepad-hid-3.2 is feat/mouse-keys-3.2 (what production uses,
      # so mouse keys are unchanged) plus the optional gamepad HID report.
      branches: '["shmatt/zmk/feat/gamepad-hid-3.2"]'
      # zmk-hid-io REMOVED: registering a second HID-over-GATT service broke
      # BLE HID on Android outright -- the keyboard would no longer pair at
      # all (USB still worked). Two HIDS primary services in one GATT
      # database is evidently more than Android's HID host will accept, and
      # hid-io's encrypted characteristics force a security upgrade on top.
      # The gamepad report has to live in ZMK's own descriptor instead.
      # NOTE: each element of this JSON array is a separate build VARIANT, not
      # an extra module. main.yml does `for module in $modules`, so several
      # modules for ONE build go in a single space-separated string.
      modules: '["shmatt/zmk-joycon2/main"]'
